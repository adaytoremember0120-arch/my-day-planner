<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contextual Me - 平日ルーティン & 休日プランナー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Georgia&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f0f2f5; color: #1e293b; }
        .serif { font-family: 'Georgia', 'Hiragino Mincho ProN', serif; }
        .animate-slide-up { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { MapPin, Clock, Coffee, Activity, AlertCircle, ShoppingCart, CheckCircle2, ChevronRight } = lucide;

        const App = () => {
            const [view, setView] = useState('home'); // 'home', 'plan', 'inventory'
            const [inventory, setInventory] = useState({
                blueberry: 3, yogurt: 3, milk: 3, mochi: 3
            });
            const [showGuard, setShowGuard] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [view, showGuard]);

            // 在庫確認ロジック
            const checkInventory = () => {
                const lowItems = Object.keys(inventory).filter(key => inventory[key] <= 2);
                return lowItems;
            };

            const lowItems = checkInventory();

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 shadow-2xl overflow-hidden flex flex-col">
                    {/* Header */}
                    <header className="p-8 pt-12 bg-white border-b border-slate-100 text-center">
                        <h1 className="text-3xl font-bold tracking-tight text-slate-900 serif">Contextual Me</h1>
                        <p className="text-slate-500 text-sm mt-2 uppercase tracking-widest">Personal Concierge</p>
                    </header>

                    <main className="flex-1 p-6 overflow-y-auto">
                        {view === 'home' && (
                            <div className="space-y-6 animate-slide-up">
                                {/* Nutrition Guard Alert */}
                                {lowItems.length > 0 && (
                                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-start gap-3">
                                        <AlertCircle className="w-5 h-5 text-amber-500 mt-0.5" />
                                        <div>
                                            <p className="text-sm font-bold text-amber-900">在庫リマインダー</p>
                                            <p className="text-xs text-amber-700 mt-1">
                                                {lowItems.join(', ')} がそろそろなくなるよ。平日の朝食に困らないように、今日買って帰る？
                                            </p>
                                        </div>
                                    </div>
                                )}

                                {/* Main Action */}
                                <div className="grid grid-cols-1 gap-4">
                                    <button 
                                        onClick={() => setView('plan')}
                                        className="bg-slate-900 text-white p-6 rounded-3xl flex flex-col items-center gap-3 hover:bg-slate-800 transition"
                                    >
                                        <Clock className="w-8 h-8" />
                                        <span className="font-bold">明日のプランを作る</span>
                                    </button>
                                    
                                    <button 
                                        onClick={() => setView('inventory')}
                                        className="bg-white border border-slate-200 p-6 rounded-3xl flex flex-col items-center gap-3 hover:bg-slate-50 transition text-slate-700"
                                    >
                                        <ShoppingCart className="w-8 h-8" />
                                        <span className="font-bold">在庫をチェック</span>
                                    </button>
                                </div>

                                {/* Context Note */}
                                <div className="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm">
                                    <p className="serif text-slate-800 italic leading-relaxed text-center">
                                        "静かな場所で本を読むこと、<br/>
                                        自分の体を整えること、<br/>
                                        それが一番の贅沢だよ。"
                                    </p>
                                </div>
                            </div>
                        )}

                        {view === 'plan' && (
                            <div className="space-y-6 animate-slide-up">
                                <h2 className="text-xl font-bold serif border-b pb-2">明日のプラン (Sunday)</h2>
                                <div className="space-y-4">
                                    <TimelineItem time="12:00" title="出発" desc="東西線でシティ・ホールへ。読書タイム。" />
                                    <TimelineItem 
                                        time="12:40" 
                                        title="ランチ @ The Glasshouse" 
                                        desc="栄養ガード発動中：穀物ボウルがおすすめ。ケーキは控えめに。" 
                                        highlight
                                    />
                                    <TimelineItem time="14:30" title="モネ展鑑賞" desc="ナショナル・ギャラリー。光の芸術を堪能。" />
                                    <TimelineItem time="17:00" title="The Book Cafe" desc="静かな空間で『任侠病院』の続きを。" />
                                </div>
                                <button onClick={() => setView('home')} className="w-full py-3 text-slate-400 text-sm mt-4">ホームに戻る</button>
                            </div>
                        )}

                        {view === 'inventory' && (
                            <div className="space-y-6 animate-slide-up">
                                <h2 className="text-xl font-bold serif border-b pb-2">必須アイテム在庫</h2>
                                <div className="grid grid-cols-1 gap-3">
                                    <InventoryRow label="ブルーベリー" count={inventory.blueberry} onAdd={() => setInventory({...inventory, blueberry: 5})} />
                                    <InventoryRow label="ヨーグルト" count={inventory.yogurt} onAdd={() => setInventory({...inventory, yogurt: 5})} />
                                    <InventoryRow label="ミルク" count={inventory.milk} onAdd={() => setInventory({...inventory, milk: 5})} />
                                    <InventoryRow label="もち" count={inventory.mochi} onAdd={() => setInventory({...inventory, mochi: 5})} />
                                </div>
                                <button onClick={() => setView('home')} className="w-full py-3 text-slate-400 text-sm mt-4">ホームに戻る</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const TimelineItem = ({ time, title, desc, highlight }) => (
            <div className={`flex gap-4 p-4 rounded-2xl ${highlight ? 'bg-amber-50 border border-amber-100' : 'bg-white'}`}>
                <div className="text-xs font-bold text-slate-400 pt-1">{time}</div>
                <div>
                    <div className="font-bold text-slate-800">{title}</div>
                    <div className="text-xs text-slate-500 mt-1 leading-relaxed">{desc}</div>
                </div>
            </div>
        );

        const InventoryRow = ({ label, count, onAdd }) => (
            <div className="flex items-center justify-between p-4 bg-white rounded-2xl border border-slate-100">
                <div>
                    <span className="font-bold text-slate-700">{label}</span>
                    <span className={`ml-3 text-sm ${count <= 2 ? 'text-rose-500 font-bold' : 'text-slate-400'}`}>あと {count}日分</span>
                </div>
                <button onClick={onAdd} className="bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition">
                    <CheckCircle2 className="w-5 h-5 text-slate-400" />
                </button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
