<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contextual Me v14.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:italic&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #020617; color: #f1f5f9; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-4 h-4" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const MASTER_DATA = {
            gyms: [
                { id: 'bm_bugis', name: "Boulder Movement Bugis", area: "Bugis", menu: "終了後のプロテイン補給。都会の喧騒を離れてリセット。" },
                { id: 'bm_rochor', name: "Boulder Movement Rochor", area: "Rochor", menu: "テクニカルな課題への挑戦。" },
                { id: 'oyeyo', name: "Oyeyo Bouldering Studio", area: "Little India", menu: "終了後は心地よい疲労感を。" },
                { id: 'fb_maxwell', name: "Fit Bloc Maxwell", area: "Maxwell", menu: "最新設備。シャワーで完全にリセット。" },
                { id: 'bp_chev', name: "Boulder+ Chevrons", area: "Jurong", menu: "広い壁でのダイナミックなトレーニング。" },
                { id: 'bp_lavender', name: "Boulder+ Lavender", area: "Lavender", menu: "持久力を。Aperia Mall内。" }
            ],
            museums: [
                { id: 'ng', name: "National Gallery Singapore", area: "City Hall", menu: "展示を堪能。歴史的な空間でアートに浸る。" },
                { id: 'sam_tp', name: "SAM at Tanjong Pagar Distripark", area: "Tanjong Pagar", menu: "現代アートの広大な空間。1階のカフェもおすすめ。" },
                { id: 'asm', name: "ArtScience Museum", area: "Marina Bay", menu: "未来的なデジタルアート体験。" }
            ],
            cafes: [
                { id: 0, name: "The Book Cafe", area: "Robertson Quay", menu: "Apple Pie", desc: "読書の聖地。ソファ席で至福の時間を。" },
                { id: 1, name: "Apartment Coffee", area: "Lavender", menu: "Filter Coffee", desc: "静寂と美しいコーヒー。" },
                { id: 2, name: "The Glasshouse", area: "City Hall", menu: "Salmon Smorrebrod", desc: "明るい温室のような空間。" },
                { id: 3, name: "Bearded Bella", area: "Tanjong Pagar", menu: "Flat White", desc: "帰り道に立ち寄る贅沢な一杯。" },
                { id: 4, name: "Common Man Coffee", area: "Robertson Quay", menu: "Veggie Wonderland", desc: "リバーサイドの読書タイム。" },
                { id: 5, name: "Kurasu Singapore", area: "Bras Basah", menu: "Matcha Latte", desc: "日本発のミニマルな空間。" },
                { id: 6, name: "Lucid", area: "Hamilton Road", menu: "Iced White", desc: "無機質で静かな空間。" },
                { id: 7, name: "Atlas Coffeehouse", area: "Bukit Timah", menu: "Banana Pancake", desc: "エネルギーチャージの名店。" },
                { id: 8, name: "Nylon Coffee Roasters", area: "Everton Park", menu: "Filter Coffee", desc: "こだわり抜かれた一杯。" },
                { id: 9, name: "PUNCH", area: "North Canal Road", menu: "Earl Grey Pancakes", desc: "中庭で過ごす贅沢な一息。" }
            ]
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [intent, setIntent] = useState('CLIMB');
            const [venue, setVenue] = useState(MASTER_DATA.gyms[0]);
            const [beforeCafe, setBeforeCafe] = useState(MASTER_DATA.cafes[2]);
            const [afterCafe, setAfterCafe] = useState(MASTER_DATA.cafes[0]);

            // エリアに応じた初期設定
            useEffect(() => {
                const vArea = venue.area;
                if (vArea.includes("Lavender") || vArea.includes("Rochor")) {
                    setBeforeCafe(MASTER_DATA.cafes[1]); setAfterCafe(MASTER_DATA.cafes[6]);
                } else if (vArea.includes("City Hall")) {
                    setBeforeCafe(MASTER_DATA.cafes[5]); setAfterCafe(MASTER_DATA.cafes[2]);
                } else if (vArea.includes("Tanjong Pagar") || vArea.includes("Maxwell")) {
                    setBeforeCafe(MASTER_DATA.cafes[9]); setAfterCafe(MASTER_DATA.cafes[3]);
                } else {
                    setBeforeCafe(MASTER_DATA.cafes[2]); setAfterCafe(MASTER_DATA.cafes[0]);
                }
            }, [venue, intent]);

            const shuffleCafe = (current, setFunc) => {
                const others = MASTER_DATA.cafes.filter(c => c.id !== current.id);
                setFunc(others[Math.floor(Math.random() * others.length)]);
            };

            const getMapsUrl = (name) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + " Singapore")}`;
            
            const getFullRouteUrl = () => {
                const stops = ["Tiong Bahru", beforeCafe.name, venue.name, afterCafe.name, "Tiong Bahru"]
                    .map(s => encodeURIComponent(s + " Singapore"))
                    .join('/');
                return `https://www.google.com/maps/dir/${stops}`;
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col p-6 space-y-8 animate-fadeIn">
                    <header className="mt-8 text-center">
                        <h1 className="text-4xl font-light tracking-tighter serif italic text-white leading-tight">Contextual Me</h1>
                        <p className="text-[10px] uppercase tracking-[0.3em] text-slate-500 mt-2 tracking-widest italic text-indigo-400">Fixed Navigator v14.0</p>
                    </header>

                    {view === 'home' && (
                        <div className="space-y-6">
                            <div className="glass p-6 rounded-[2.5rem] space-y-6 border-white/10 shadow-2xl">
                                <div className="flex bg-slate-900 rounded-2xl p-1 border border-white/5">
                                    <button onClick={() => setIntent('CLIMB')} className={`flex-1 py-3 rounded-xl text-[10px] font-bold transition ${intent === 'CLIMB' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>CLIMB</button>
                                    <button onClick={() => setIntent('CULTURE')} className={`flex-1 py-3 rounded-xl text-[10px] font-bold transition ${intent === 'CULTURE' ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>MUSEUM</button>
                                </div>
                                <div className="space-y-4 px-2">
                                    <label className="text-[10px] uppercase tracking-widest text-slate-500 block mb-1">Destination</label>
                                    <select 
                                        className="w-full bg-slate-900/80 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none appearance-none"
                                        onChange={(e) => {
                                            const list = intent === 'CLIMB' ? MASTER_DATA.gyms : MASTER_DATA.museums;
                                            setVenue(list.find(v => v.name === e.target.value));
                                        }}
                                        value={venue.name}
                                    >
                                        {(intent === 'CLIMB' ? MASTER_DATA.gyms : MASTER_DATA.museums).map(v => (
                                            <option key={v.id} value={v.name} className="bg-slate-900 text-white">{v.name}</option>
                                        ))}
                                    </select>
                                </div>
                                <button onClick={() => setView('plan')} className="w-full btn-gradient text-white py-5 rounded-3xl font-bold hover:opacity-90 transition text-xs tracking-widest uppercase">Go to Plan</button>
                            </div>
                        </div>
                    )}

                    {view === 'plan' && (
                        <div className="space-y-6 animate-fadeIn pb-12">
                            <div className="flex items-center justify-between px-2">
                                <h2 className="text-xl serif italic text-white">Your Route</h2>
                                <a href={getFullRouteUrl()} target="_blank" className="bg-indigo-500/20 text-indigo-300 text-[10px] font-bold py-2 px-4 rounded-full border border-indigo-500/30 flex items-center gap-2">
                                    <Icon name="map" className="w-3 h-3" /> Full Route
                                </a>
                            </div>
                            <div className="space-y-10 relative ml-4 before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[1px] before:bg-slate-800">
                                <TimelineItem time="Pre-Stop" title={beforeCafe.name} desc={beforeCafe.desc} menu={beforeCafe.menu} url={getMapsUrl(beforeCafe.name)} icon="coffee" onShuffle={() => shuffleCafe(beforeCafe, setBeforeCafe)} />
                                <TimelineItem time="Event" title={venue.name} desc={`${venue.area} にて。`} menu={venue.menu} url={getMapsUrl(venue.name)} icon={intent === 'CLIMB' ? "activity" : "palette"} active />
                                <TimelineItem time="Reading" title={afterCafe.name} desc={`帰り道、${afterCafe.area} で。`} menu={afterCafe.menu} url={getMapsUrl(afterCafe.name)} icon="book-open" onShuffle={() => shuffleCafe(afterCafe, setAfterCafe)} />
                                <TimelineItem time="Home" title="Tiong Bahru" desc="穏やかな一日の終わり。" icon="home" />
                            </div>
                            <button onClick={() => setView('home')} className="w-full py-4 text-[10px] text-slate-600 uppercase tracking-widest mt-8 border-t border-white/5">Modify Plan</button>
                        </div>
                    )}
                </div>
            );
        };

        const TimelineItem = ({ time, title, desc, menu, url, icon, active, onShuffle }) => (
            <div className="flex gap-6 relative">
                <div className={`w-[23px] h-[23px] rounded-full z-10 flex items-center justify-center ${active ? 'bg-indigo-600 shadow-[0_0_15px_rgba(79,70,229,0.5)] text-white' : 'bg-slate-950 border border-slate-800 text-slate-500'}`}>
                    <Icon name={icon} className="w-3 h-3" />
                </div>
                <div className="flex-1 -mt-1">
                    <div className="flex justify-between items-start">
                        <span className="text-[10px] font-bold text-slate-600 tracking-tighter uppercase">{time}</span>
                        {onShuffle && <button onClick={onShuffle} className="text-indigo-400/50 hover:text-indigo-400 p-1 -mt-1"><Icon name="refresh-cw" className="w-3 h-3" /></button>}
                    </div>
                    <h3 className={`text-sm font-bold ${active ? 'text-white' : 'text-slate-300'} hover:underline`}>
                        {url ? <a href={url} target="_blank">{title}</a> : title}
                    </h3>
                    <p className="text-[11px] text-slate-500 mt-1 leading-relaxed">{desc}</p>
                    {menu && (
                        <div className="mt-3 bg-white/5 rounded-2xl p-4 border border-white/5">
                            <span className="text-[9px] uppercase tracking-wider text-indigo-400 font-bold block mb-1">Recommended</span>
                            <p className="text-[10px] text-slate-300 leading-relaxed">{menu}</p>
                        </div>
                    )}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
