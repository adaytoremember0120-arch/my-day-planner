<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contextual Me v5.0 - Culture & Climb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:italic&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #0f172a; color: #f1f5f9; margin: 0; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .animate-in { animation: fadeInUp 0.8s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { MapPin, Clock, Coffee, Activity, AlertCircle, ShoppingCart, CheckCircle2, ChevronRight, BookOpen, Palette } = lucideReact;

        const MASTER_DATA = {
            gyms: [
                { id: 'bff_ben', name: "BFF Climb Bendemeer", area: "Bendemeer" },
                { id: 'bff_bt', name: "BFF Climb Bukit Timah", area: "Bukit Timah" },
                { id: 'bm_tp', name: "Boulder Movement Tanjong Pagar", area: "Tanjong Pagar" },
                { id: 'bm_sun', name: "Boulder Movement Suntec", area: "Suntec" },
                { id: 'ps', name: "Project Send", area: "Esplanade" },
                { id: 'boruda', name: "Boruda", area: "Alexandra" }
            ],
            museums: [
                { id: 'ng', name: "National Gallery Singapore", area: "City Hall" },
                { id: 'nm', name: "National Museum of Singapore", area: "Dhoby Ghaut" },
                { id: 'asm', name: "ArtScience Museum", area: "Marina Bay" },
                { id: 'acm', name: "Asian Civilisations Museum", area: "Raffles Place" },
                { id: 'pm', name: "Peranakan Museum", area: "City Hall" },
                { id: 'sam', name: "Singapore Art Museum (SAM)", area: "Tanjong Pagar" },
                { id: 'lkc', name: "Lee Kong Chian Natural History", area: "Clementi" }
            ],
            cafes: [
                { name: "Apartment Coffee", area: "Lavender", desc: "洗練された光とコーヒー。BFF Bendemeerからの帰り道に。" },
                { name: "The Glasshouse CHIJMES", area: "City Hall", desc: "温室のような空間。美術館巡りの後の栄養補給に。" },
                { name: "Atlas Coffeehouse", area: "Bukit Timah", desc: "BFF BT後の読書スポット。" },
                { name: "Bearded Bella", area: "Tanjong Pagar", desc: "チョンバルの手前で、少しだけ寄り道。" },
                { name: "Merci Marcel", area: "Tiong Bahru", desc: "家に戻る前の、いつもの安心感。" },
                { name: "Common Man Coffee", area: "Robertson Quay", desc: "川沿いの静かな午後。" }
            ]
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [intent, setIntent] = useState('CLIMB'); // 'CLIMB' or 'CULTURE'
            const [venue, setVenue] = useState(MASTER_DATA.gyms[0]);

            const getRecommendedCafe = (vArea) => {
                if (vArea === "Bendemeer") return MASTER_DATA.cafes[0];
                if (vArea === "City Hall" || vArea === "Dhoby Ghaut") return MASTER_DATA.cafes[1];
                if (vArea === "Bukit Timah") return MASTER_DATA.cafes[2];
                if (vArea === "Tanjong Pagar") return MASTER_DATA.cafes[3];
                return MASTER_DATA.cafes[4];
            };

            const recommendedCafe = getRecommendedCafe(venue.area);

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col p-6 space-y-8 animate-in">
                    <header className="mt-8 text-center">
                        <h1 className="text-4xl font-light tracking-tighter serif italic text-white">Contextual Me</h1>
                        <p className="text-[10px] uppercase tracking-[0.3em] text-slate-500 mt-2">Culture & Movement Optimized</p>
                    </header>

                    {view === 'home' && (
                        <div className="space-y-6">
                            <div className="glass p-6 rounded-[2.5rem] space-y-6">
                                {/* Intent Toggle */}
                                <div className="flex bg-slate-900/50 rounded-2xl p-1">
                                    <button 
                                        onClick={() => { setIntent('CLIMB'); setVenue(MASTER_DATA.gyms[0]); }}
                                        className={`flex-1 py-3 rounded-xl text-xs font-bold transition ${intent === 'CLIMB' ? 'bg-indigo-500 text-white shadow-lg' : 'text-slate-500'}`}
                                    >
                                        <Activity size={14} className="inline mr-2" /> CLIMB
                                    </button>
                                    <button 
                                        onClick={() => { setIntent('CULTURE'); setVenue(MASTER_DATA.museums[0]); }}
                                        className={`flex-1 py-3 rounded-xl text-xs font-bold transition ${intent === 'CULTURE' ? 'bg-indigo-500 text-white shadow-lg' : 'text-slate-500'}`}
                                    >
                                        <Palette size={14} className="inline mr-2" /> CULTURE
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    <label className="text-[10px] uppercase tracking-widest text-slate-500 ml-2">目的地を選択</label>
                                    <select 
                                        className="w-full bg-transparent border-b border-slate-800 p-2 text-sm text-white focus:outline-none"
                                        onChange={(e) => {
                                            const list = intent === 'CLIMB' ? MASTER_DATA.gyms : MASTER_DATA.museums;
                                            setVenue(list.find(v => v.name === e.target.value));
                                        }}
                                        value={venue.name}
                                    >
                                        {(intent === 'CLIMB' ? MASTER_DATA.gyms : MASTER_DATA.museums).map(v => (
                                            <option key={v.id} value={v.name} className="bg-slate-900">{v.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <button 
                                    onClick={() => setView('plan')}
                                    className="w-full bg-indigo-500/20 text-indigo-400 py-5 rounded-3xl font-bold hover:bg-indigo-500/30 transition text-sm tracking-widest"
                                >
                                    プランを生成する
                                </button>
                            </div>

                            <div className="pt-8 border-t border-slate-900 text-center">
                                <p className="text-xs text-slate-500 italic leading-loose">
                                    "静かな展示室、あるいは壁のホールド。<br/>
                                    どちらにせよ、最後は心地よい一杯のコーヒーへ。"
                                </p>
                            </div>
                        </div>
                    )}

                    {view === 'plan' && (
                        <div className="space-y-6">
                            <h2 className="text-xl serif italic text-white">Your Optimized Route</h2>
                            
                            <div className="space-y-8 relative before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[1px] before:bg-slate-800">
                                <TimelineItem 
                                    time="Destination" 
                                    title={venue.name} 
                                    desc={`${venue.area} で過ごす贅沢な時間。`} 
                                />
                                <TimelineItem 
                                    time="On the Way" 
                                    title={recommendedCafe.name} 
                                    desc={recommendedCafe.desc} 
                                    active 
                                />
                                <TimelineItem 
                                    time="Home" 
                                    title="Tiong Bahru" 
                                    desc="明日の準備をして、ゆっくりと眠りにつく。" 
                                />
                            </div>

                            <button onClick={() => setView('home')} className="w-full py-4 text-xs text-slate-500 uppercase tracking-widest mt-8">Modify Selection</button>
                        </div>
                    )}
                </div>
            );
        };

        const TimelineItem = ({ time, title, desc, active }) => (
            <div className="flex gap-6 relative animate-in">
                <div className={`w-[23px] h-[23px] rounded-full z-10 flex items-center justify-center ${active ? 'bg-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.5)]' : 'bg-slate-900 border border-slate-800'}`}>
                    {active && <div className="w-2 h-2 bg-white rounded-full"></div>}
                </div>
                <div className="flex-1 -mt-1">
                    <span className="text-[10px] font-bold text-slate-600 tracking-tighter uppercase">{time}</span>
                    <h3 className={`text-sm font-bold ${active ? 'text-white' : 'text-slate-400'}`}>{title}</h3>
                    <p className="text-xs text-slate-500 mt-1 leading-relaxed">{desc}</p>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
